[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "physprog"
version = "1.0.0"
description = "Physical Programming algorithm to robustly build aggregate objective functions for multiobjective optimization"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    { name = "Nick Touran", email = "physprog@partofthething.com" },
]
keywords = ["physical", "programming", "multiobjective", "optimization", "aggregate"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pyyaml",
]

[project.urls]
Homepage = "https://github.com/partofthething/physprog"
Repository = "https://github.com/partofthething/physprog"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear (catches e.g. late-binding closures in loops)
    "C4",  # comprehensions
    "SIM", # simplifications
    "PL",  # pylint rules
    "RUF", # ruff-specific
    "D",   # docstrings
]
ignore = [
    "PLR0913", # too many arguments (plotting functions take many options)
    "PLR2004", # magic values in comparisons
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"physprog/tests/*" = ["D"]

[tool.pytest.ini_options]
testpaths = ["physprog/tests"]
