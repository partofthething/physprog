[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "physprog"
version = "0.1.0"
description = "Physical Programming algorithm to robustly build aggregate objective functions for multiobjective optimization"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Nick Touran", email = "physprog@partofthething.com" },
]
keywords = ["physical", "programming", "multiobjective", "optimization", "aggregate"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pyyaml",
]

[project.urls]
Homepage = "https://github.com/partofthething/physprog"
Repository = "https://github.com/partofthething/physprog"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["physprog/tests"]
